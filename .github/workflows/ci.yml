name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source files parse
        # No test suite yet — verify every JS file is syntactically valid.
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print \
            | xargs -I{} node --check {}

      - name: Smoke-check server boots
        # server.js requires env to fully run, so just confirm it loads
        # without a syntax/require error by type-checking the entrypoint.
        run: node --check server.js
